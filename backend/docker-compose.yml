services:
  postgres:
    image: postgres:18-alpine
    container_name: tripmint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tripmint}
      POSTGRES_USER: ${DB_USERNAME:-tripmint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tripmint_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tripmint_postgres_data:
